name: Tests y publicación en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests del motor (si fallan, no se publica)
        run: node tests/run-tests.mjs
      - name: Preparar el sitio
        run: |
          pip install --quiet pillow
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          python icons/make_icons.py _site/icons
          touch _site/.nojekyll
          ls -la _site _site/icons
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
