<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qué me pongo">
<meta name="description" content="Qué ponerme los días de oficina con la ropa que tengo.">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Qué me pongo</title>
<style>
:root {
  --bg: #f2f3f1; --paper: #ffffff; --paper2: #f7f7f5; --ink: #1d232d; --soft: #5b6270; --line: #d9dcd8;
  --accent: #7a2a35; --accent-ink: #ffffff; --accent-soft: #f3e3e5; --skin: #cfcac3; --outline: rgba(29,35,45,.28);
  --ok: #2f6b45; --ok-bg: #e2f0e6; --warn: #8a5a0b; --warn-bg: #f6ecd6; --bad: #9b2c2c; --bad-bg: #f6e0df;
  --shadow: 0 1px 2px rgba(29,35,45,.06), 0 4px 16px rgba(29,35,45,.05);
  --f-display: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --f-body: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --tabs-h: 58px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14171c; --paper: #1c2027; --paper2: #232831; --ink: #e9e7e3; --soft: #a4a9b2; --line: #2e333c;
  --accent: #d98894; --accent-ink: #1c1116; --accent-soft: #3a2328; --skin: #57534e; --outline: rgba(233,231,227,.30);
  --ok: #7fc797; --ok-bg: #1d3326; --warn: #e3b866; --warn-bg: #3a2f17; --bad: #ec8b86; --bad-bg: #3d2120;
  --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #14171c; --paper: #1c2027; --paper2: #232831; --ink: #e9e7e3; --soft: #a4a9b2; --line: #2e333c;
  --accent: #d98894; --accent-ink: #1c1116; --accent-soft: #3a2328; --skin: #57534e; --outline: rgba(233,231,227,.30);
  --ok: #7fc797; --ok-bg: #1d3326; --warn: #e3b866; --warn-bg: #3a2f17; --bad: #ec8b86; --bad-bg: #3d2120;
  --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); min-height: 100vh;
  padding-top: var(--sat); padding-bottom: calc(var(--tabs-h) + var(--sab)); overflow-x: hidden; }
body.noscroll { overflow: hidden; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 { font-size: 1.9rem; line-height: 1.1; }
h2 { font-size: 1.25rem; line-height: 1.2; }
h3 { font-size: 1.02rem; line-height: 1.25; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--soft); }
.small { font-size: .85rem; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; color: var(--soft); }

main.view { max-width: 600px; margin: 0 auto; padding: 14px max(16px, var(--sar)) 28px max(16px, var(--sal)); display: grid; gap: 16px; }
.head { display: grid; gap: 10px; padding-top: 4px; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stack { display: grid; gap: 8px; }

/* Botones */
.btn { min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; font-size: .95rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.btn.sm { min-height: 44px; padding: 8px 12px; font-size: .88rem; }
.linkbtn { background: none; border: 0; padding: 10px 4px; min-height: 44px; color: var(--accent); font-weight: 600; font-size: .9rem; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Control segmentado */
.seg { display: flex; background: var(--paper2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 44px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; font-size: .9rem; color: var(--soft); padding: 4px 6px; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.wide button { min-height: 44px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.occ { background: var(--accent-soft); color: var(--accent); }
.pill.neutral { background: var(--paper2); color: var(--soft); border: 1px solid var(--line); }

/* Avisos */
.notice { border-radius: 12px; padding: 10px 12px; font-size: .9rem; display: grid; gap: 6px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.notice.info { background: var(--paper2); color: var(--soft); border: 1px solid var(--line); }
.notice ul { margin: 0; padding-left: 18px; }

/* Tiempo */
.wx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wx-tile { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.wx-tile b { display: block; font-family: var(--f-display); font-size: 1.45rem; font-weight: 600; line-height: 1.15; }
.wx-tile span { display: block; font-size: .72rem; color: var(--soft); line-height: 1.25; }
.wx-src { font-size: .78rem; color: var(--soft); display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Propuesta */
.prop-top { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; }
.score { display: grid; gap: 6px; align-content: center; }
.score .num { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; font-weight: 600; }
.score .num small { font-size: .9rem; color: var(--soft); font-weight: 400; }
.score .title { font-size: .78rem; color: var(--soft); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.pieces { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.piece { width: 100%; min-height: 46px; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; text-align: left; }
.piece .pn { font-weight: 500; font-size: .95rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.piece .ps { font-size: .75rem; color: var(--soft); display: inline-flex; align-items: center; gap: 4px; }
.piece .ps svg { width: 14px; height: 14px; }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--outline); background-size: cover; background-position: center; flex: none; }
.frase { font-size: .93rem; line-height: 1.45; }
.frase b { font-weight: 600; }
.worn { color: var(--ok); font-weight: 600; font-size: .9rem; }
.subnotas { display: flex; gap: 12px; font-size: .78rem; color: var(--soft); }
.subnotas b { color: var(--ink); font-weight: 600; }
.nomeconvence { justify-self: center; color: var(--soft); margin-top: -6px; }
.alt.meh { background: var(--paper2); opacity: .7; }
.alt.matiz .alt-sub.motivo { color: var(--warn); }
.alt.meh .alt-sub.motivo { color: var(--warn); }
.chip.meh { opacity: .6; }
.tag-fija { color: var(--accent); font-weight: 700; }
.piece.fija .pn { font-weight: 600; }
.fijas-info { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 8px; font-size: .85rem; color: var(--soft); margin-top: -4px; }
.fijas-info .fijas-btns { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.fijas-info .btn.sm { white-space: nowrap; }
.alt-txt { display: grid; gap: 2px; min-width: 0; }
.alt-sub { line-height: 1.3; }
.chip-n { font-family: var(--f-mono); font-size: .75rem; font-weight: 600; padding: 1px 6px; border-radius: 999px; margin-left: 2px; }
.chip-n.ok { background: var(--ok-bg); color: var(--ok); } .chip-n.warn { background: var(--warn-bg); color: var(--warn); } .chip-n.bad { background: var(--bad-bg); color: var(--bad); }

/* Figura */
svg.fig { display: block; width: 100%; height: auto; }
svg.fig .o { stroke: var(--outline); stroke-width: .8; }
svg.fig .ph { fill: none; stroke: var(--outline); stroke-dasharray: 3 3; }

/* Probador */
.notes { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .9rem; }
.notes li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: baseline; }
.notes .g { font-family: var(--f-mono); font-weight: 600; font-size: .82rem; text-align: right; }
.notes .plus .g { color: var(--ok); } .notes .minus .g { color: var(--bad); }
.slot { display: grid; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; border: 1px solid var(--line); background: var(--paper); padding: 6px 12px 6px 7px; border-radius: 999px; font-size: .88rem; text-align: left; max-width: 100%; }
.chip .dot { width: 24px; height: 24px; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.chip.off { opacity: .45; }
.chip.none .dot { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--line) 4px 6px); }
.sticky-score { position: sticky; top: calc(var(--sat) + 6px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: color-mix(in srgb, var(--paper) 92%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow); }
.sticky-score b { font-family: var(--f-display); font-size: 1.3rem; }
.suggest { background: var(--paper2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; font-size: .9rem; }
.field { display: grid; gap: 6px; }
.field > span { font-size: .8rem; font-weight: 600; color: var(--soft); }
.input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 8px 12px; width: 100%; font-size: 16px; }
textarea.input { min-height: 80px; resize: vertical; }
.inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

/* Armario */
.list { display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.item { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 8px 12px; min-height: 60px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item .thumb { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--outline); background-size: cover; background-position: center; }
.item .meta { min-width: 0; display: grid; }
.item .meta strong { font-weight: 600; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta small { color: var(--soft); font-size: .78rem; }
.item.off .meta strong { color: var(--soft); }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
details.arch summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--soft); }

/* Interruptor */
.switch { position: relative; display: inline-flex; align-items: center; min-width: 51px; min-height: 44px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 51px; height: 31px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }

/* Ficha */
.photo { width: 100%; aspect-ratio: 16/9; max-height: 220px; border-radius: 14px; border: 1px solid var(--line); background-size: cover; background-position: center; display: grid; place-items: center; color: rgba(255,255,255,.85); font-size: .85rem; }
.months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.months button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; font-size: .85rem; }
.months button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.colorpair { display: flex; gap: 10px; align-items: center; }
input[type="color"].input { padding: 4px; width: 64px; height: 44px; }
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat div { background: var(--paper2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.4rem; }
.stat span { font-size: .78rem; color: var(--soft); }

/* Ajustes */
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.days button { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-weight: 700; }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.thr { display: grid; grid-template-columns: 1fr 84px; gap: 8px 12px; align-items: center; }
.thr input { text-align: center; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: .92rem; }
.url { font-family: var(--f-mono); font-size: .8rem; word-break: break-all; background: var(--paper2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.tests li.f { color: var(--bad); }
.tests { font-size: .82rem; margin: 0; padding-left: 18px; display: grid; gap: 3px; }

/* Barra de pestañas */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 0 var(--sar) var(--sab) var(--sal); background: color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px); border-top: 1px solid var(--line); }
nav.tabs button { min-height: var(--tabs-h); border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: .7rem; font-weight: 600; color: var(--soft); }
nav.tabs button svg { width: 25px; height: 25px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

/* Hoja inferior */
#sheet { position: fixed; inset: 0; z-index: 40; }
#sheet .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.38); opacity: 0; transition: opacity .2s; }
#sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100vh - var(--sat) - 24px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg); border-radius: 18px 18px 0 0; padding: 8px max(16px, var(--sar)) calc(20px + var(--sab)) max(16px, var(--sal));
  transform: translateY(100%); transition: transform .25s ease; max-width: 640px; margin: 0 auto; overscroll-behavior: contain; }
#sheet.open .backdrop { opacity: 1; }
#sheet.open .panel { transform: none; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: -8px; background: var(--bg); padding: 4px 0 8px; z-index: 1; }
.sheet-body { display: grid; gap: 14px; }
.alt { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; min-height: 52px; padding: 8px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; text-align: left; }
.alt.cur { border-color: var(--ink); }
.alt.off { opacity: .55; background: var(--paper2); }
.alt.off .alt-sub { color: var(--bad); }
.chip.veto { opacity: .4; text-decoration: line-through; text-decoration-thickness: 1px; }
.notes .duro .g { color: var(--bad); }
.notes .duro span:last-child { font-weight: 600; }

/* Asistente */
#wizard { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: calc(var(--sat) + 16px) max(20px, var(--sar)) calc(var(--sab) + 20px) max(20px, var(--sal)); }
#wizard .inner { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; min-height: 100%; align-content: start; }
.progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.progress span { height: 4px; border-radius: 2px; background: var(--line); }
.progress span.on { background: var(--accent); }
.q { display: grid; gap: 8px; padding: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
.q .seg button { font-size: .85rem; }

/* Toast y actualización */
#toast { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; line-height: 1.35; bottom: calc(var(--tabs-h) + var(--sab) + 12px); z-index: 60; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px; display: flex; gap: 6px; align-items: center; font-size: .9rem; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#toast button { background: none; border: 0; color: var(--bg); font-weight: 700; min-height: 40px; padding: 0 10px; text-decoration: underline; }
#update { position: fixed; top: calc(var(--sat) + 8px); left: 16px; right: 16px; z-index: 70; max-width: 560px; margin: 0 auto; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
#update button { min-height: 40px; border-radius: 10px; border: 0; background: var(--accent-ink); color: var(--accent); font-weight: 700; padding: 0 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="view" id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Secciones">
  <button type="button" data-act="vista" data-v="hoy" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Hoy</button>
  <button type="button" data-act="vista" data-v="probador">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.2a2.2 2.2 0 1 1 2.2-2.2c0 1.2-2.2 1.6-2.2 3.2v.6l8.6 6.1c.9.6.5 2.1-.6 2.1H4c-1.1 0-1.5-1.5-.6-2.1L12 8.8"/></svg>Probador</button>
  <button type="button" data-act="vista" data-v="armario">

const _oklab = {};

function zonasVisibles(o, M) {

  if (base) z.push({ p: base, rol: 'base', a: capa ? 0.04 : ext ? 0.15 : 0.35 });

  if (o.calzado && M[o.calzado]) z.push({ p: M[o.calzado], rol: 'calzado', a: 0.08 });
  if (o.calcetin && M[o.calcetin]) z.push({ p: M[o.calcetin], rol: 'calcetin', a: 0.02 });

/* ---------- Evaluación ----------
   o: {base, capa, exterior, pantalon, calzado, calcetin} (ids)
   M: mapa id → prenda
   ctx (opcional): {tiempo:{ts,tmax,lluvia}, umbrales, mes, hoy, usos, tipoDia, gustos}
   Devuelve: nota (final), estilo, contexto, veredicto, ocasion, notas[{ajuste,texto,regla,ambito,duro}], reglas[] */
function evaluar(o, M, ctx) {
  const C = CFG;
  const base = M[o.base], capa = o.capa ? M[o.capa] : null, ext = o.exterior ? M[o.exterior] : null;
  const pant = M[o.pantalon], calz = M[o.calzado], calc = o.calcetin ? M[o.calcetin] : null;
  if (!base || !pant || !calz) return { nota: 0, estilo: 0, contexto: 0, veredicto: C.textosVeredicto.no, ocasion: '—', notas: [{ ajuste: 0, texto: 'Falta base, pantalón o calzado', regla: 'incompleto' }], reglas: ['Falta base, pantalón o calzado'], incompleto: true };
  const notas = [];
  // duro = regla obligatoria: si se incumple, el outfit no pega (nota ≤ notaMaxRegla) y no se propone
  const add = (ajuste, texto, regla, duro) => { if (ajuste !== 0 || duro) notas.push({ ajuste: Math.round(ajuste * 10) / 10, texto, regla, duro: !!duro, ambito: 'estilo' }); };
  const arriba = capa || base;
  const z = zonasVisibles(o, M);
  const grandes = z.filter(x => x.a >= 0.10 && x.rol !== 'calzado' && x.rol !== 'calcetin');
  const hayClaro = z.some(x => x.rol !== 'calzado' && x.rol !== 'calcetin' && Lp(x.p) >= 0.70);

  /* 1. Parejas en contacto (matriz con condiciones) */
  const contactos = [[arriba, pant, C.contactos.arribaPantalon]];
  if (ext) { contactos.push([ext, arriba, C.contactos.exteriorArriba]); contactos.push([ext, pant, C.contactos.exteriorPantalon]); }
  const vistos = new Set();
  for (const [x, y, w] of contactos) {
    const fx = famPar(x), fy = famPar(y), k = parKey(fx, fy);
    if (vistos.has(k)) continue;
    vistos.add(k);
    if (fx === fy) {
      if (Math.abs(Lp(x) - Lp(y)) >= C.tonal.dL) add(C.tonal.ajuste * w, C.tonal.texto, 'par');
      continue;
    }
    const r = PARES.get(k);
    if (!r) { if (fx === 'blanco' || fy === 'blanco') add(C.blanco.ajuste * w, C.blanco.texto, 'par'); continue; }
    if (r.v === 'muy') add(C.muyBuena * w, r.texto, 'par');
    else if (r.v === 'ok') add(C.correcta * w, r.texto, 'par');
    else if (r.v === 'cond') {
      if (r.cond === 'dL') { const okL = Math.abs(Lp(x) - Lp(y)) >= r.min; add((okL ? r.si : r.no) * w, okL ? r.texto : r.textoNo, 'par'); }
      else if (r.cond === 'claro') add((hayClaro ? r.si : r.no) * (hayClaro ? w : 1), hayClaro ? r.texto : r.textoNo, 'par');
      else if (r.cond === 'grisClaro') { const g = fx === 'gris' ? x : y; const okG = Lp(g) >= r.min; if (okG) add(r.si * w, r.texto, 'par'); }
      else if (r.cond === 'navidad') add(Math.max(Cp(x), Cp(y)) >= C.color.saturado ? r.fuerte : r.suave, r.texto, 'par');
      else if (r.cond === 'marronClaro') { const mr = fx === 'marrón' ? x : y; if (Lp(mr) > r.min) add(r.no, r.textoNo, 'par'); }
    }
  }

  /* 2. Casi-coincidencia y mismo color entre prendas grandes en contacto */
  const CI = C.color.casiIgual, MC = C.color.mismoColor;
  for (const [x, y] of contactos) {
    const d = dE(x, y), mismaFam = famColor(x) === famColor(y);
    const apagadoConNegro = (famColor(x) === 'negro' && Cp(y) < CI.cromaApagado) || (famColor(y) === 'negro' && Cp(x) < CI.cromaApagado);
    const tex = contrasteTextura(x, y);
    if (d < MC.dE && mismaFam) {
      if (x === arriba && y === pant) add(tex ? MC.ajusteTextura : MC.ajuste, tex ? MC.textoTextura : MC.texto, 'mismoColor');
      else add(tex ? MC.ajusteTextura : MC.ajuste, `${x.nombre} y ${y.nombre.toLowerCase()} casi iguales: les falta contraste`, 'mismoColor');
    } else if (d < CI.dE && Math.abs(Lp(x) - Lp(y)) < CI.dL && Math.max(Lp(x), Lp(y)) < CI.Lmax && (mismaFam || apagadoConNegro)) {
      add(tex ? CI.ajusteTextura : CI.ajuste, `${x.nombre} y ${y.nombre.toLowerCase()}: dos oscuros casi iguales ${CI.texto}`, 'casiIgual');
    }
  }

  /* 3. Todo oscuro (prendas grandes) */
  const TO = C.color.todoOscuro;
  if (grandes.length >= 2) {
    const Ls = grandes.map(x => Lp(x.p)), maxL = Math.max(...Ls), media = Ls.reduce((s, v) => s + v, 0) / Ls.length;
    if (maxL < TO.Lmax && media < TO.Lmedia && grandes.every(x => Cp(x.p) < C.color.saturado)) {
      const variedad = new Set(grandes.map(x => textura(x.p))).size >= 2;
      add(TO.ajuste * (variedad ? TO.factorTextura : 1), TO.texto, 'oscuro');
    }
  }

  const PL = C.color.plano;
  if (grandes.length >= 2 && new Set(grandes.map(x => famColor(x.p))).size === 1) {
    const Ls = grandes.map(x => Lp(x.p));
    if (Math.max(...Ls) - Math.min(...Ls) < PL.rango) add(PL.ajuste, PL.texto, 'plano');
  }

  /* 4. Luminosidad arriba-abajo (Ou y Luo, 2006) */
  const LU = C.color.luz, dLab = Math.abs(Lp(arriba) - Lp(pant));
  if (dLab >= LU.min && dLab <= LU.max && Math.max(Lp(arriba), Lp(pant)) >= LU.claro) add(LU.ajuste, LU.texto, 'luz');

  /* 5. Complejidad de la paleta (entropía ponderada por superficie) */
  const cx = complejidad(z), CX = C.color.complejidad;
  if (cx.H > CX.umbral) add(-(cx.H - CX.umbral) * CX.factor, `${CX.texto} (${cx.familias.length}: ${cx.familias.join(', ')})`, 'complejidad');
  else if (cx.H <= CX.bonusHasta && grandes.length >= 2 && !notas.some(n => ['casiIgual', 'mismoColor', 'plano', 'oscuro'].includes(n.regla))) add(CX.bonus, CX.textoBonus, 'complejidad');
  const NC = C.color.notas;
  const famRopa = [...new Set(z.filter(x => !['calzado', 'calcetin'].includes(x.rol) && x.a >= NC.areaMin && famColor(x.p) !== 'blanco').map(x => famColor(x.p)))];
  if (famRopa.length >= 4) add(famRopa.length >= 5 ? NC.cinco : NC.cuatro, `${famRopa.length} ${NC.texto} (${famRopa.join(', ')})`, 'complejidad');

  /* 6. Un solo foco saturado */
  const focos = [...new Set(z.filter(x => Cp(x.p) >= C.color.saturado && x.a >= 0.02).map(x => famColor(x.p)))];
  if (focos.length > 1) add(C.color.focos.ajuste, `${C.color.focos.texto} (${focos.join(', ')})`, 'focos');
  if (calz.llamativo && focos.length > 0) add(C.focoCalzado.ajuste, C.focoCalzado.texto, 'focos');

  const cromaticas = [...new Set(z.filter(x => x.rol !== 'calcetin' && !acromatica(x.p)).map(x => famColor(x.p)))];
  if (z.some(x => famColor(x.p) === 'rojo' && Cp(x.p) >= C.color.saturado) && cromaticas.every(f => f === 'rojo' || f === 'tierra') && cromaticas.includes('tierra'))
    add(C.color.calidoSobreCalido.ajuste, C.color.calidoSobreCalido.texto, 'calido');

  /* 7. Neutros cálido y frío grandes en contacto */
  for (const [x, y, w] of contactos) {
    if (w < 1 && x !== ext) continue;
    const fx = famColor(x), fy = famColor(y);
    if ((fx === 'gris' && fam(y) === 'beige') || (fy === 'gris' && fam(x) === 'beige')) { add(C.color.calidoFrio.ajuste, C.color.calidoFrio.texto, 'calidoFrio'); break; }
  }

  /* 8. Capas: regla de los tres tonos con cazadora y lo que asoma bajo el jersey */
  if (ext) {
    const T = C.capas.tresTonos, mid = arriba, tonos = [ext, mid, pant];
    const distintos = tonos.every((p, i) => tonos.every((q, j) => i >= j || Math.abs(Lp(p) - Lp(q)) >= T.dL));
    const igualOscuros = Lp(ext) < T.oscuro && Lp(mid) < T.oscuro;
    if (!distintos && !igualOscuros) add(T.ajuste, T.texto, 'capas');
  }
  if (capa) {
    const K = C.capas.cuello;
    const dLc = Math.abs(Lp(base) - Lp(capa)), tonalC = famColor(base) === famColor(capa);
    if (Lp(base) >= K.claro) add(K.bonus, K.textoBonus, 'cuello');
    else if (tonalC && dLc >= K.tonal) add(0, '', 'cuello');
    else {
      if (dLc < K.funde) add(K.ajusteFunde, K.textoFunde, 'cuello');
      if (!tonalC) {
        add(K.oscuro, K.textoOscuro, 'cuello');
        const fb = famColor(base), repite = z.some(x => x.p !== base && x.rol !== 'calcetin' && famColor(x.p) === fb);
        if (!ACROMATICOS.has(fb) && !repite) add(K.sinRepetir, K.textoSinRepetir, 'cuello');
      }
    }
    // El rojo y el verde juntos en el cuello también cuentan
    const r = PARES.get(parKey(famPar(base), famPar(capa)));
    if (r && r.cond === 'navidad') add(Math.max(Cp(base), Cp(capa)) >= C.color.saturado ? r.fuerte : r.suave, r.texto, 'par');
    const E = C.capas.estructura;
    const e = base.tipo === 'camisa' ? E.camisa : base.tipo === 'camiseta' ? E.camiseta : textura(base) === 'punto' ? E.poloPunto : E.polo;
    add(e[0], e[1], 'estructura');
  }

  /* 9. Formalidad: rango global entre prendas visibles */
  const Fs = z.filter(x => x.rol !== 'calcetin' && x.p.formalidad != null && !(x.rol === 'base' && capa)).map(x => ({ p: x.p, F: formalidadEf(x.p) }));
  const hi = Fs.reduce((a, b) => b.F > a.F ? b : a), lo = Fs.reduce((a, b) => b.F < a.F ? b : a), R = C.formalidad.rango;
  const rango = hi.F - lo.F;
  if (rango >= R.duro) add(R.ajuste, `${R.textoDuro}: ${hi.p.nombre.toLowerCase()} con ${lo.p.nombre.toLowerCase()}`, 'formalidad', true);
  else if (rango >= R.suave) add(R.ajuste, `${R.texto}: ${hi.p.nombre.toLowerCase()} con ${lo.p.nombre.toLowerCase()}`, 'formalidad');

  /* 10. Texturas */
  const tx = textura(arriba);
  if (tx === 'punto' && textura(calz) === 'ante' && (pant.tipo === 'chino' || pant.tipo === 'vaquero') && rango < R.suave) add(C.texturas.mezcla.ajuste, C.texturas.mezcla.texto, 'texturas');
  const txSup = ext ? textura(ext) : tx;
  if (txSup === textura(pant) || tx === textura(pant)) add(C.texturas.mismoTejido.ajuste, C.texturas.mismoTejido.texto, 'texturas');

  /* 11. Calzado */
  const reglasZap = C.calzado[calz.id] || C.calzado['_' + calz.tipo] || [];
  for (const r of reglasZap) {
    if (cumple(r.pantalon, pant) && cumple(r.base, base)) { add(r.ajuste, rellenar(r.texto, { pf: fam(pant) }), 'calzado'); break; }
  }
  const vol = (C.volumen[pant.corte] || {})[calz.volumen];
  if (vol) add(vol[0], vol[1], 'volumen');
  if (calz.id === 'zap-derby-cognac' && famPar(arriba) === 'azul cielo') add(C.cognacCeleste.ajuste, C.cognacCeleste.texto, 'calzado');

  /* 12. Calcetines: acompañan al pantalón */
  if (calc) {
    const K = C.calcetines, sf = fam(calc), pf = fam(pant);
    if (sf === 'blanco') {
      if (calz.tipo === 'derby') add(-20, K.blancoDerby.texto, 'calcetin', true);
      else if (pant.tipo === 'chino') add(K.blancoChinoZapatilla.ajuste, K.blancoChinoZapatilla.texto, 'calcetin');
      else if (pant.tipo === 'vaquero') add(K.blancoOk.ajuste, K.blancoOk.texto, 'calcetin');
    } else {
      if (pant.tipo === 'chino') {
        const rec = K.recomendado[pf] || [pf];
        if (rec.includes(sf)) add(K.coincide.ajuste, rellenar(K.coincide.texto, { sf, pf }), 'calcetin');
        else if (Lp(calc) > Lp(pant) + K.masClaro.dL) add(K.masClaro.ajuste, K.masClaro.texto, 'calcetin');
        else add(K.masOscuro.ajuste, K.masOscuro.texto, 'calcetin');
      }
      if (calz.tipo === 'derby') add(Lp(calc) < 0.7 ? K.derbyOscuro.ajuste : K.claroDerby.ajuste, Lp(calc) < 0.7 ? K.derbyOscuro.texto : K.claroDerby.texto, 'calcetin');
    }
  }

  /* Estilo: base + ajustes, con rendimiento decreciente de lo que suma */
  const positivos = notas.filter(n => n.ajuste > 0).reduce((a, n) => a + n.ajuste, 0);
  if (positivos > C.tope.desde) add(-(positivos - C.tope.desde) * (1 - C.tope.factor), C.tope.texto, 'tope');
  const sumaEstilo = notas.reduce((s, n) => s + n.ajuste, 0);
  const estiloBruto = C.puntosBase + sumaEstilo;

  /* Contexto: tiempo, tipo de día, temporada, rotación y tus gustos */
  let contexto = 100;
  if (ctx) {
    const addC = (ajuste, texto, regla, duro) => { if (ajuste !== 0 || duro) { notas.push({ ajuste: Math.round(ajuste * 10) / 10, texto, regla, duro: !!duro, ambito: 'contexto' }); contexto += ajuste; } };
    aplicarContexto(o, M, ctx, z, addC);
    contexto = Math.max(0, Math.min(100, contexto));
  }

  const reglas = notas.filter(n => n.duro).map(n => n.texto);
  let estilo = Math.max(0, Math.min(100, Math.round(estiloBruto)));
  let bruto = estiloBruto - C.pesoContexto * (100 - contexto);
  let nota = Math.max(0, Math.min(100, Math.round(bruto)));
  if (reglas.length) { nota = Math.min(nota, C.notaMaxRegla); bruto = Math.min(bruto, C.notaMaxRegla); }
  const v = C.veredicto, tv = C.textosVeredicto;
  const veredicto = reglas.length ? tv.no : nota >= v.pega ? tv.pega : nota >= v.matices ? tv.matices : tv.no;
  notas.sort((a, b) => (b.duro ? 1 : 0) - (a.duro ? 1 : 0) || Math.abs(b.ajuste) - Math.abs(a.ajuste));
  return { nota, estilo, contexto: Math.round(contexto), bruto, veredicto, ocasion: ocasionDe(o, M), notas, reglas, complejidad: cx.H };
}

/* Contexto: tipo de día (objetivo y mínimo de formalidad), tiempo, temporada, rotación y gustos */
function aplicarContexto(o, M, ctx, z, add) {
  const C = CFG;
  const base = M[o.base], capa = o.capa ? M[o.capa] : null, ext = o.exterior ? M[o.exterior] : null, pant = M[o.pantalon], calz = M[o.calzado];
  const TD = ctx.tipoDia && C.tipoDia[ctx.tipoDia];
  if (TD) {
    // Obligatorio: mínimo de formalidad en cada prenda visible y camiseta sola
    const visibles = z.filter(x => x.rol !== 'calcetin' && x.p.formalidad != null && !(x.rol === 'base' && capa));
    for (const x of visibles) if (x.p.formalidad < TD.minimo) add(-20, `${x.p.nombre}: no va en un día «${TD.nombre}»`, 'dia', true);
    if (!TD.camisetaSola && base.tipo === 'camiseta' && !capa) add(-20, `Camiseta sin jersey: no va en un día «${TD.nombre}»`, 'dia', true);
    // Suave: ajuste al objetivo de formalidad del día
    const AF = C.ajusteFormalidad, t = visibles.reduce((s, x) => s + x.a, 0) || 1;
    const media = visibles.reduce((s, x) => s + x.a * formalidadEf(x.p), 0) / t, dist = Math.abs(media - TD.objetivo);
    if (dist > AF.tolerancia) add(AF.porPunto * (dist - AF.tolerancia), media < TD.objetivo ? `Algo informal para un día «${TD.nombre}»` : `Algo formal para un día «${TD.nombre}»`, 'dia');
    for (const x of visibles) if (formalidadEf(x.p) < TD.objetivo - AF.bajo && x.p.formalidad >= TD.minimo) add(AF.ajusteBajo, `${x.p.nombre} rebaja el tono para un día «${TD.nombre}»`, 'dia');
    // Al quitarse el jersey en la oficina no conviene quedarse en camiseta
    if (capa && base.tipo === 'camiseta' && !TD.camisetaSola) add(C.trayecto.baseNoSola.ajuste, C.trayecto.baseNoSola.texto, 'trayecto');
  }
  const t = ctx.tiempo, u = ctx.umbrales || AJUSTES_BASE.umbrales;
  if (t) {
    if (t.lluvia != null && t.lluvia >= u.lluvia) {
      for (const p of [base, capa, ext, pant, calz]) {
        if (!p) continue;
        const pen = C.lluvia.penaliza[p.id], fav = C.lluvia.favorece[p.id];
        if (pen) add(pen[0], pen[1], 'lluvia');
        if (fav) add(fav[0], fav[1], 'lluvia');
      }
    }
    if (t.ts != null && t.tmax != null && Math.abs(t.tmax - t.ts) > u.difTrayecto) {
      const T = C.trayecto;
      if (t.ts >= u.unaCapa && t.ts < u.sinCapa) {
        if (ext && !capa) add(T.exteriorFacil.ajuste, T.exteriorFacil.texto, 'trayecto');
        if (capa && !ext) add(T.soloJersey.ajuste, T.soloJersey.texto, 'trayecto');
      }
      if ((capa || ext) && base.formalidad >= 3) add(T.baseSola.ajuste, T.baseSola.texto, 'trayecto');
    }
    if (t.tmax != null && t.tmax >= u.baseLigera) {
      if (/lino/i.test(base.material || '')) add(C.calor.lino.ajuste, C.calor.lino.texto, 'calor');
      else if (base.tipo === 'polo-punto') add(C.calor.poloPunto.ajuste, C.calor.poloPunto.texto, 'calor');
    }
    if (t.ts != null && t.ts < u.dosCapas && ext && ext.abrigo >= 3) add(C.abrigoInvierno.ajuste, C.abrigoInvierno.texto, 'frio');
  }
  if (ctx.mes) {
    for (const p of [base, capa, ext]) if (p && !enMes(p, ctx.mes)) add(C.temporada.ajuste, `${p.nombre}: ${C.temporada.texto}`, 'temporada');
    const tz = C.temporadaCalzado[calz.id];
    if (tz && !tz.meses.includes(ctx.mes)) add(tz.ajuste, tz.texto, 'temporada');
  }
  if (ctx.usos && ctx.usos.length && ctx.hoy) aplicarRotacion(o, M, ctx, add);
  if (ctx.gustos) aplicarGustos(o, ctx.gustos, add);
}
// «No me convence»: penaliza el outfit exacto y, con menos fuerza, la pareja arriba + pantalón
function aplicarGustos(o, gustos, add) {
  const G = CFG.gustos, no = gustos.no || [];
  if (!no.length) return;
  const k = claveSinCalcetin(o), par = arribaDe(o) + '|' + o.pantalon;
  if (no.some(x => x.clave === k)) add(G.outfit, G.textoOutfit, 'gustos');
  else {
    const n = no.filter(x => x.par === par).length;
    if (n) add(Math.max(G.maxPar, G.par * n), G.textoPar, 'gustos');
  }
}

function diasEntre(a, b) { return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000); }
const TIPOS_OFICINA = ['reunion', 'normal', 'casual'];
function aplicarRotacion(o, M, ctx, add) {
  const R = CFG.rotacion, hoy = ctx.hoy;
  const previos = ctx.usos.filter(u => u.fecha < hoy);
  const fechasOficina = [...new Set(previos.filter(u => TIPOS_OFICINA.includes(u.tipoDia)).map(u => u.fecha))].sort().reverse().slice(0, R.diasOficina);
  const recientes = new Set();
  for (const u of previos) if (fechasOficina.includes(u.fecha)) u.ids.forEach(id => recientes.add(id));
  for (const h of HUECOS) {
    const id = o[h.k]; if (!id || h.k === 'calcetin' || !recientes.has(id)) continue;
    const aj = (h.k === 'base' || h.k === 'capa' || h.k === 'exterior') ? R.prendaReciente.arriba : R.prendaReciente.resto;
    add(aj, `${M[id].nombre}: ${R.prendaReciente.texto}`, 'rotacion');
  }
  const k = claveSinCalcetin(o), dias = R.semanas * 7;
  if (previos.some(u => diasEntre(u.fecha, hoy) <= dias && claveSinCalcetin(u.o || idsAOutfit(u.ids, M)) === k)) add(R.outfitRepetido.ajuste, R.outfitRepetido.texto, 'rotacion');
  const usadasVentana = new Set();
  for (const u of previos) if (diasEntre(u.fecha, hoy) <= dias) u.ids.forEach(id => usadasVentana.add(id));
  let plus = 0;
  for (const h of HUECOS) { const id = o[h.k]; if (id && h.k !== 'calcetin' && !usadasVentana.has(id)) plus += R.sinUsar.ajuste; }
  if (plus) add(Math.min(plus, R.sinUsar.max), R.sinUsar.texto, 'rotacion');
}
function idsAOutfit(ids, M) {
  const o = { base: null, capa: null, exterior: null, pantalon: null, calzado: null, calcetin: null };
  for (const id of ids) { const p = M[id]; if (p && o[p.hueco] === null) o[p.hueco] = id; }
  return o;
}

/* ---------- Tiempo (apartado 7) ---------- */
function encajaTiempo(o, M, t, u) {
  u = u || AJUSTES_BASE.umbrales;
  const motivos = [];
  if (!t) return { ok: true, motivos };

    else if (r) {
      if (r.v === 'muy') add(C.muyBuena, r.texto);
      else if (r.v === 'ok') add(C.correcta, r.texto);

    if (Lp(b) >= K.claro) add(K.bonus, K.textoBonus);

/* ---------- PROBADOR ---------- */
function vistaProbador() {
  const Mp = M(), o = S.probador;
  const completo = o.base && o.pantalon && o.calzado && o.calcetin && Mp[o.base] && Mp[o.pantalon] && Mp[o.calzado] && Mp[o.calcetin];
  let h = `<header class="head"><div class="eyebrow">Una prenda por hueco</div><h1>Probador</h1></header>`;
  if (completo) {
    const e = evaluar(o, Mp);
    const t = tiempoPara(hoyISO()), enc = encajaTiempo(o, Mp, t, S.ajustes.umbrales);
    const suma = e.notas.filter(n => n.ajuste > 0), resta = e.notas.filter(n => n.ajuste < 0);
    const mej = mejorMejora(o, S.prendas, null);
    const mejOk = mej && (!t || !enc.ok || encajaTiempo(Object.assign({}, o, { [mej.hueco]: mej.id }), Mp, t, S.ajustes.umbrales).ok);
    h += `<section class="card">
      <div class="prop-top" style="grid-template-columns:110px 1fr"><div>${figura(o, Mp)}</div>
        <div class="score"><div class="num">${e.nota}<small>/100</small></div><div class="row"><span class="pill ${vClase(e.veredicto)}">${e.veredicto}</span><span class="pill occ">${esc(e.ocasion)}</span></div></div></div>
      ${t && !enc.ok ? `<div class="notice warn"><b>No encaja con el tiempo de hoy</b><ul>${enc.motivos.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}
      ${suma.length ? `<div class="stack"><h3>Lo que suma</h3><ul class="notes">${suma.map(n => `<li class="plus"><span class="g">+${n.ajuste}</span><span>${esc(n.texto)}</span></li>`).join('')}</ul></div>` : ''}
      ${resta.length ? `<div class="stack"><h3>Lo que resta</h3><ul class="notes">${resta.map(n => `<li class="minus${n.duro ? ' duro' : ''}"><span class="g">${n.duro ? '✕' : n.ajuste}</span><span>${n.duro ? 'Regla incumplida: ' : ''}${esc(n.texto)}</span></li>`).join('')}</ul></div>` : ''}

      ${mejOk ? (() => { const hu = HUECOS.find(x => x.k === mej.hueco); const nuevo = mej.id ? `«${Mp[mej.id].nombre}»` : hu.sin.toLowerCase(); const viejo = o[mej.hueco] ? `«${Mp[o[mej.hueco]].nombre}»` : hu.sin.toLowerCase();
        const accion = !o[mej.hueco] ? `añade ${esc(nuevo)}` : !mej.id ? `quita ${esc(viejo)}` : `cambia ${esc(viejo)} por ${esc(nuevo)}`;
        return `<div class="suggest"><span><b>Mejor mejora:</b> ${accion} y sube a <b>${mej.nota}</b>.</span><button class="btn accent" type="button" data-act="aplicar" data-h="${mej.hueco}" data-id="${mej.id || ''}">Aplicar</button></div>`; })() : ''}
      <form class="inline" data-form="favorito"><input class="input" name="nombre" placeholder="Nombre del favorito" maxlength="40" required aria-label="Nombre del favorito"><button class="btn" type="submit">Guardar</button></form>
    </section>`;
  } else {
    h += `<div class="notice info">Elige base, pantalón, calzado y calcetín para ver la nota.</div>`;
  }
  if (completo) { const e2 = evaluar(o, Mp); h += `<div class="sticky-score" aria-hidden="true"><span><b>${e2.nota}</b><span class="muted small">/100</span></span><span class="row"><span class="pill ${vClase(e2.veredicto)}">${e2.veredicto}</span><button class="btn sm ghost" type="button" data-act="arriba">Ver detalle</button></span></div>`; }
  // Cada opción se ordena por la nota que tendría el outfit con ella y con el resto de lo que has elegido

  for (const hu of HUECOS) {

    if (hu.opcional) lista.unshift({ p: null, id: null });

        return `<button type="button" class="chip${x.p.disponible ? '' : ' off'}${veto}" data-act="elegir" data-h="${hu.k}" data-id="${esc(x.id)}" aria-pressed="${sel}"${tit}>${dotHTML(x.p)}<span>${esc(x.p.nombre)}${x.p.disponible ? '' : ' · no disp.'}</span>${badge}</button>`;
      }).join('')}
    </div></section>`;
  }
  if (S.favoritos.length) {
    h += `<section class="stack"><h2>Favoritos</h2><div class="list">${S.favoritos.map(f => `<div class="item" data-act="fav-cargar" data-id="${esc(f.id)}"><span class="thumb" style="${swatch(Mp[f.o.base])}"></span><span class="meta"><strong>${esc(f.nombre)}</strong><small>${esc(Object.values(f.o).filter(Boolean).map(id => Mp[id] ? Mp[id].nombre : '¿?').join(' · '))}</small></span><button class="btn sm ghost" type="button" data-act="fav-borrar" data-id="${esc(f.id)}" aria-label="Borrar ${esc(f.nombre)}">Borrar</button></div>`).join('')}</div></section>`;
  }
  return h;
}

  cinturones(el) { S.ajustes.cinturones = el.value.trim(); guardar(); },
  importar(el) { const f = el.files && el.files[0]; if (f) importar(f); el.value = ''; },
  'w-hora'(el) { if (el.value) W.hora = el.value; }
};
async function guardarFicha(form) {
  const fd = new FormData(form);
  const segVal = k => { const b = form.querySelector(`[data-seg="${k}"] [aria-pressed="true"]`); return b ? b.dataset.v : null; };
  const hueco = fd.get('hueco');
  let p = UI.fichaNueva ? null : S.prendas.find(x => x.id === UI.fichaId);
  const nueva = !p;
  if (nueva) { p = P(idUnico(fd.get('nombre')), '', hueco, '', '', '#888888', null, 0); }
  p.nombre = String(fd.get('nombre')).trim(); p.hueco = hueco; p.tipo = fd.get('tipo') || (TIPOS[hueco] || [''])[0];
  p.familia = String(fd.get('familia')).trim().toLowerCase(); p.hex = fd.get('hex'); p.hex2 = fd.get('tieneHex2') ? fd.get('hex2') : null;
  const F = segVal('formalidad'); p.formalidad = hueco === 'calcetin' ? null : (F != null ? +F : (p.formalidad != null ? p.formalidad : 3));
  const A = segVal('abrigo'); p.abrigo = ['base', 'capa', 'exterior'].includes(hueco) ? (A != null ? +A : (p.abrigo || 1)) : 0;
  const ct = segVal('corte'); p.corte = hueco === 'pantalon' ? (ct || null) : null;
  const vl = segVal('volumen'); p.volumen = hueco === 'calzado' ? (vl || null) : null;
  const mg = segVal('manga'); p.manga = hueco === 'base' ? (mg || p.manga || 'corta') : null;
  p.temporadas = UI.fichaMeses.slice().sort((a, b) => a - b);
  ['material', 'cuidados', 'tienda', 'ref', 'notas'].forEach(k => p[k] = String(fd.get(k) || '').trim());
  p.disponible = !!fd.get('disponible'); p.llamativo = hueco === 'calzado' ? !!fd.get('llamativo') : false;
  try {
    if (UI.fichaFotoNueva === 'borrar' && p.fotoId) { await IDB.del(p.fotoId); delete urlFotos[p.fotoId]; p.fotoId = null; }
    else if (UI.fichaFotoNueva instanceof Blob) {
      if (p.fotoId) { await IDB.del(p.fotoId).catch(() => {}); delete urlFotos[p.fotoId]; }
      p.fotoId = 'foto-' + p.id + '-' + Date.now(); await IDB.put(p.fotoId, UI.fichaFotoNueva);
    }
  } catch (e) { toast('No se pudo guardar la foto'); }
  if (nueva) S.prendas.push(p);
  guardar(); UI.buenos = null; recalcularHoy(); cerrarHoja(); render();
  toast(nueva ? `«${p.nombre}» añadida` : 'Cambios guardados');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item[role="button"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && !$('#sheet').hidden) cerrarHoja();
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const tipo = f.dataset.form;
  if (tipo === 'tiempo') {
    const fd = new FormData(f), ts = Number(fd.get('ts')), tmax = Number(fd.get('tmax')), ll = Number(fd.get('lluvia') || 0);
    if (!Number.isFinite(ts) || !Number.isFinite(tmax)) return;
    S.tiempoManual[f.dataset.fecha] = { ts, tmax, lluvia: Math.max(0, Math.min(100, ll)) }; guardar(); recalcularHoy(); cerrarHoja(); render();
  } else if (tipo === 'favorito') {
    const nombre = String(new FormData(f).get('nombre')).trim(); if (!nombre) return;
    S.favoritos.push({ id: 'fav-' + Date.now(), nombre, o: clonar(S.probador) }); guardar(); render(); toast(`Favorito «${nombre}» guardado`);
  } else if (tipo === 'ficha') guardarFicha(f);
});

/* ---------- Exportar / importar ---------- */
async function exportar() {
  const fotos = {};
  try { for (const k of await IDB.claves()) { const b = await IDB.get(k); if (b) fotos[k] = await blobADataURL(b); } } catch (e) {}
  const datos = { app: 'que-me-pongo', version: VERSION, exportado: new Date().toISOString(), estado: Object.assign({}, S, { tiempo: null }), fotos };
  const nombre = `que-me-pongo-${hoyISO()}.json`;
  const blob = new Blob([JSON.stringify(datos)], { type: 'application/json' });
  const file = typeof File === 'function' ? new File([blob], nombre, { type: 'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Copia de Qué me pongo' }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function importar(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== 'que-me-pongo' || !d.estado || !Array.isArray(d.estado.prendas)) throw new Error('No es una copia de Qué me pongo');
    if (!confirm(`Copia del ${String(d.exportado || '').slice(0, 10)} con ${d.estado.prendas.length} prendas. Sustituye todo lo de este iPhone. ¿Continuar?`)) return;
    await IDB.vaciar().catch(() => {});
    for (const [k, v] of Object.entries(d.fotos || {})) { try { await IDB.put(k, await dataURLABlob(v)); } catch (e) {} }
    Object.keys(urlFotos).forEach(k => delete urlFotos[k]);
    S = migrar(d.estado); S.onboarded = true; guardar(); aplicarPesos(); UI.cache = null; UI.buenos = null; render(); toast('Copia importada');
  } catch (e) { toast(e.message || 'No se pudo importar'); }
}

/* ---------- Almacenamiento persistente ---------- */
function pedirPersistencia() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { S.persistente = ok; guardar(); pintarPersistencia(); }).catch(() => {});
}
function pintarPersistencia() {
  const el = $('#persist-info'); if (!el) return;
  if (!navigator.storage || !navigator.storage.persisted) { el.textContent = ''; return; }
  navigator.storage.persisted().then(ok => { el.textContent = ok ? 'Almacenamiento persistente: activado.' : 'Almacenamiento persistente: no concedido todavía. Instala la app en la pantalla de inicio.'; });
}

/* ---------- Service worker y aviso de nueva versión ---------- */
function registrarSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  let recargando = false;
  // Solo se recarga al pasar a una versión nueva, no en la primera instalación (que también cambia de controlador)
  const habiaControlador = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (recargando || !habiaControlador) return; recargando = true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const avisar = w => { $('#update').hidden = false; $('#update-btn').onclick = () => { $('#update-btn').disabled = true; w.postMessage('SKIP_WAITING'); }; };
    if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisar(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

/* ---------- Arranque ---------- */
window.runTests = runTests;
window.QMP = { get estado() { return S; }, UI, render };
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (!S.tiempo || S.tiempo.fecha !== hoyISO()) cargarTiempo(); else { UI.cache = null; render(); } }
});
window.addEventListener('online', () => cargarTiempo());
render();
if (!S.onboarded) abrirAsistente(); else pedirPersistencia();
cargarTiempo();
registrarSW();
})();
